<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body >
    <nav class="navbar">
        <a href="/" data-link>Home</a>
        <a href="/chat" data-link>Chat</a>
        <a href="/about" data-link>About</a>
    </nav>

    <main id="app"></main>

    <div class="chat">
        <header>
            <h1>Chat</h1>
            <h2>Rick Sanchez</h2>
            <p>Chatea con Rick Sanchez</p>

        </header>
        
        <main class="chatMessages" id="chatMessages" arial-label="Mensajes">
            <div class="chatBot">Hola Morty,comoandaaaaaaaaaaaaaaaaaaaaaaaaaaaas e</div>
            <div class="chatUser">Hola Rick</div>


        </main>
        
        <form class="chatComposer" id="chatForm">
            <input 
                id="chatInput"
                class="chatInput" 
                type="text" 
                placeholder="Escribe un mensaje…"
                aria-label="Escribe tu mensaje"
            />
            <button class="chatSend" type="submit">Enviar</button>
        </form>
    </div>
    

    <footer>

    </footer>

    
<script src="chat.js"></script>
<script type="module" src="./app.js"></script>
</body>

</html>
