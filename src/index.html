<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Chat</h1>
        <h2>Rick Sanchez</h2>
        <p>Chatea con Rick Sanchez</p>

    </header>
    
    <main class="chat-container" arial-label="Mensajes">
        <div class="chat-rick">Hola Morty</div>
        <div class="chat-user">Hola Rick</div>
    </main>
    
    <form class="chatComposer">
        <input 
        class="chatInput" 
        type="text" 
        placeholder="Escribe un mensaje…"
        aria-label="Escribe tu mensaje"
        />
        <button class="chatSend" type="submit">Enviar</button>
    </form>

    <footer>

    </footer>
  
   

    

</body>
</html>
